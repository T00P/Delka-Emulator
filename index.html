<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delka Emulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 16px 32px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .brand span {
            color: var(--accent);
        }

        .exit-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }

        .exit-btn:hover {
            background: #dc2626;
        }

        .card-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-top: 60px;
        }

        .library-container {
            max-width: 900px;
            width: 90%;
            display: none;
            margin-top: 100px;
            padding-bottom: 40px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent);
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .primary-btn:hover {
            background-color: var(--accent-hover);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 16px;
            width: fit-content;
        }

        .badge-gba { background: #3b82f6; color: #ffffff; }
        .badge-nds { background: #ec4899; color: #ffffff; }
        .badge-gbc { background: #10b981; color: #ffffff; }

        .play-link {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--accent);
        }

        #game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #000;
            z-index: 5;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        #error-msg {
            color: #f87171;
            font-size: 0.875rem;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            Delka<span>™</span> Emulator
        </div>
        <button id="exit-btn" class="exit-btn" onclick="location.reload()">Exit Game</button>
    </header>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="card-container">
        <h2>System Login</h2>
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button class="primary-btn" onclick="checkLogin()">Sign In</button>
        <p id="error-msg">Invalid username or password</p>
    </div>

    <!-- MENU SCREEN -->
    <div id="menu-screen" class="library-container">
        <h2>Select a Game</h2>
        <div class="game-grid">
            
            <div class="game-card" onclick="loadGame('nds', 'Mario Kart DS.zip')">
                <div>
                    <span class="badge badge-nds">Nintendo DS</span>
                    <div class="game-title">Mario Kart DS</div>
                </div>
                <div class="play-link">Launch Game →</div>
            </div>

            <div class="game-card" onclick="loadGame('gba', 'Mario Kart_ Super Circuit.zip')">
                <div>
                    <span class="badge badge-gba">GBA</span>
                    <div class="game-title">Mario Kart Super Circuit</div>
                </div>
                <div class="play-link">Launch Game →</div>
            </div>

            <div class="game-card" onclick="loadGame('gba', 'Pokemon_ FireRed Version.zip')">
                <div>
                    <span class="badge badge-gba">GBA</span>
                    <div class="game-title">Pokémon FireRed</div>
                </div>
                <div class="play-link">Launch Game →</div>
            </div>

            <div class="game-card" onclick="loadGame('gba', 'Pokemon - Leaf Green Version (U) (V1.1).zip')">
                <div>
                    <span class="badge badge-gba">GBA</span>
                    <div class="game-title">Pokémon LeafGreen</div>
                </div>
                <div class="play-link">Launch Game →</div>
            </div>

            <div class="game-card" onclick="loadGame('gbc', 'Pokemon_ Crystal Version.zip')">
                <div>
                    <span class="badge badge-gbc">Game Boy Color</span>
                    <div class="game-title">Pokémon Crystal</div>
                </div>
                <div class="play-link">Launch Game →</div>
            </div>

        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div id="game-container"></div>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            if (user === "admin" && pass === "abc123") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("menu-screen").style.display = "block";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function loadGame(core, romFile) {
            document.getElementById("menu-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";
            document.getElementById("exit-btn").style.display = "block";

            window.EJS_player = '#game-container';
            window.EJS_core = core;
            window.EJS_gameUrl = romFile;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            
            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }
    </script>
</body></html></html>
