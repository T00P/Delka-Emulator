<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delka Emulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #151d30;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --border-hover: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Top Header Branding */
        header {
            width: 100%;
            padding: 18px 32px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .brand span {
            color: var(--accent);
        }

        /* Form & Library Containers */
        .card-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-top: 60px;
        }

        .library-container {
            max-width: 960px;
            width: 90%;
            display: none;
            margin-top: 100px;
            padding-bottom: 40px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        /* Inputs & Primary Buttons */
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0b0f19;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0b0f19;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(56, 189, 248, 0.3);
        }

        /* Game Library Cards */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 20px;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: 0 12px 24px -5px rgba(56, 189, 248, 0.2);
        }

        .game-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-top: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: fit-content;
        }

        .badge-gba { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
        .badge-nds { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.4); }
        .badge-gbc { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }

        /* Modern Launch Button */
        .play-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-weight: 700;
            font-size: 0.9rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .game-card:hover .play-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0b0f19;
            border-color: transparent;
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
        }

        /* Game Full Screen & Bottom Bar */
        #game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: #000;
            z-index: 50;
            flex-direction: column;
        }

        #game-container {
            width: 100%;
            height: calc(100vh - 60px);
        }

        .bottom-bar {
            height: 60px;
            width: 100%;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 60;
        }

        .active-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .active-title span {
            color: var(--text-main);
            font-weight: 700;
        }

        .exit-btn-bottom {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .exit-btn-bottom:hover {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        #error-msg {
            color: #f87171;
            font-size: 0.875rem;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Header Branding -->
    <header>
        <div class="brand">
            Delka<span>™</span> Emulator
        </div>
    </header>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="card-container">
        <h2>System Login</h2>
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button class="primary-btn" onclick="checkLogin()">Sign In</button>
        <p id="error-msg">Invalid username or password</p>
    </div>

    <!-- MENU SCREEN -->
    <div id="menu-screen" class="library-container">
        <h2>Select a Game</h2>
        <div class="game-grid">
            
            <!-- Mario Kart DS -->
            <div class="game-card" onclick="loadGame('nds', 'Mario Kart DS.zip', 'Mario Kart DS')">
                <div>
                    <span class="badge badge-nds">Nintendo DS</span>
                    <div class="game-title">Mario Kart DS</div>
                </div>
                <button class="play-btn">
                    ▶ Play Game
                </button>
            </div>

            <!-- Mario Kart Super Circuit -->
            <div class="game-card" onclick="loadGame('gba', 'Mario Kart_ Super Circuit.zip', 'Mario Kart Super Circuit')">
                <div>
                    <span class="badge badge-gba">GBA</span>
                    <div class="game-title">Mario Kart Super Circuit</div>
                </div>
                <button class="play-btn">
                    ▶ Play Game
                </button>
            </div>

            <!-- Pokemon FireRed -->
            <div class="game-card" onclick="loadGame('gba', 'Pokemon_ FireRed Version.zip', 'Pokémon FireRed')">
                <div>
                    <span class="badge badge-gba">GBA</span>
                    <div class="game-title">Pokémon FireRed</div>
                </div>
                <button class="play-btn">
                    ▶ Play Game
                </button>
            </div>

            <!-- Pokemon LeafGreen -->
            <div class="game-card" onclick="loadGame('gba', 'Pokemon - Leaf Green Version (U) (V1.1).zip', 'Pokémon LeafGreen')">
                <div>
                    <span class="badge badge-gba">GBA</span>
                    <div class="game-title">Pokémon LeafGreen</div>
                </div>
                <button class="play-btn">
                    ▶ Play Game
                </button>
            </div>

            <!-- Pokemon Crystal -->
            <div class="game-card" onclick="loadGame('gbc', 'Pokemon_ Crystal Version.zip', 'Pokémon Crystal')">
                <div>
                    <span class="badge badge-gbc">Game Boy Color</span>
                    <div class="game-title">Pokémon Crystal</div>
                </div>
                <button class="play-btn">
                    ▶ Play Game
                </button>
            </div>

        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div id="game-container"></div>
        <div class="bottom-bar">
            <div class="active-title">
                Now Playing: <span id="active-game-name">Game</span>
            </div>
            <button class="exit-btn-bottom" onclick="location.reload()">
                ✕ Exit to Menu
            </button>
        </div>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            if (user === "admin" && pass === "abc123") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("menu-screen").style.display = "block";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function loadGame(core, romFile, gameTitle) {
            document.getElementById("menu-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "flex";
            document.getElementById("active-game-name").innerText = gameTitle;

            window.EJS_player = '#game-container';
            window.EJS_core = core;
            window.EJS_gameUrl = romFile;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            
            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
