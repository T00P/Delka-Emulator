<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delka Emulator</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }
        .brand-title {
            color: #4CAF50;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            background-color: #3a3a3a;
            color: white;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            border: none;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #45a049; }
        .game-btn {
            background-color: #008CBA;
            margin: 5px 0;
        }
        .game-btn:hover { background-color: #007bb5; }
        
        /* Emulator Container takes up full screen when active */
        #game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="container">
        <h1 class="brand-title">Delka&trade; Emulator</h1>
        <h3>System Login</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="checkLogin()">Enter</button>
        <p id="error-msg" style="color: #ff4c4c; display: none;">Invalid credentials</p>
    </div>

    <!-- MENU SCREEN -->
    <div id="menu-screen" class="container" style="display: none;">
        <h1 class="brand-title">Delka&trade; Emulator</h1>
        <h3>Select Game</h3>
        <!-- Cores: nds = Nintendo DS, gba = GameBoy Advance, gbc = GameBoy Color -->
        <button class="game-btn" onclick="loadGame('nds', 'Mario Kart DS.zip')">Mario Kart DS</button>
        <button class="game-btn" onclick="loadGame('gba', 'Pokemon_ FireRed Version.zip')">Pokémon FireRed</button>
        <button class="game-btn" onclick="loadGame('gbc', 'Pokemon_ Crystal Version.zip')">Pokémon Crystal</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div id="game-container"></div>
    </div>

    <script>
        // Simple Login Logic
        function checkLogin() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            if (user === "admin" && pass === "abc123") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("menu-screen").style.display = "block";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        // Load EmulatorJS and the selected ROM
        function loadGame(core, romFile) {
            document.getElementById("menu-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";

            // Configure EmulatorJS globals
            window.EJS_player = '#game-container';
            window.EJS_core = core;
            window.EJS_gameUrl = romFile; // Looks for the file in the same folder on GitHub Pages
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; // Loads the emulator engine remotely
            
            // Inject the emulator script into the page
            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
